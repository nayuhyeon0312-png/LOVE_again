<style>
:root{--bg:#121216;--card:#1c1c24;--border:#2e2e3e;--primary:#ff4b72;--primary-hover:#ff2a57;--text:#e2e2e8;--muted:#8e8ea0}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:15px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.1rem;color:var(--primary)}
#connection{font-size:0.8rem;color:#4ade80;background:rgba(74,222,128,0.1);padding:4px 8px;border-radius:12px;border:1px solid rgba(74,222,128,0.2)}
#connection.error{color:#f87171;background:rgba(248,113,113,0.1);border-color:rgba(248,113,113,0.2)}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--border)}
nav button{flex:1;padding:12px;background:none;border:none;color:var(--muted);font-weight:bold;cursor:pointer;border-bottom:2px solid transparent}
nav button.active{color:var(--primary);border-bottom-color:var(--primary)}
main{flex:1;max-width:600px;width:100%;margin:0 auto;padding:15px}
.screen{display:none}.screen.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px;margin-bottom:15px}
label{display:block;font-size:0.85rem;color:var(--muted);margin-bottom:6px}
input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:#16161e;color:var(--text);margin-bottom:12px}
button.primary{background:var(--primary);border:none;font-weight:bold;cursor:pointer;color:#fff}
button.primary:hover{background:var(--primary-hover)}
.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.person{background:#16161e;border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-weight:bold}
#messages{height:350px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px;background:#16161e;border-radius:8px;margin-bottom:12px}
.bubble{max-width:80%;padding:10px;border-radius:12px;background:var(--card);align-self:flex-start}
.bubble.me{align-self:flex-end;background:var(--primary);color:#fff}
.who{font-size:0.75rem;color:var(--muted);margin-bottom:2px}
.bubble.me .who{color:rgba(255,255,255,0.8)}
.notice{background:rgba(255,75,114,0.1);border:1px solid var(--primary);padding:10px;border-radius:8px;margin-bottom:12px;font-size:0.85rem;text-align:center}
.hidden{display:none}
</style>

// AI 대화 생성을 위한 함수
async function fetchAIResponse(target, userMsg, playerInfo) {
  const apiKey = ""; // Gemini API 키 (자동 주입)
  const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

  let systemPrompt = `당신은 연애 리얼리티 프로그램 '우리들의 환승연애'의 출연자 '${target}'입니다.
상대방(${playerInfo.name}, 직업: ${playerInfo.job})이 당신에게 메시지를 보냈습니다.
캐릭터의 특성과 성격을 살려 한국어 1~2문장으로 아주 자연스럽고 호감 어린(또는 찐친 같은) 대답을 해주세요.
절대 인공지능인 티를 내지 마세요. 카카오톡 다정/훈훈한 말투를 유지하세요.`;

  if (target === '하우스 단체방') {
    systemPrompt = `당신은 '우리들의 환승연애' 하우스 단체 톡방의 출연자 중 한 명(박보검, 차은우, 하린, 지우 등 중 한 명을 임의로 골라)입니다.
형식: "이름: 메시지내용" (예: 박보검: 다들 모여서 밥 먹자!)
상대방의 말에 호응하는 따뜻하고 훈훈한 단체방 수다 1문장을 작성하세요.`;
  } else if (target === '여자 단체방') {
    systemPrompt = `당신은 '우리들의 환승연애' 여자 출연자 중 한 명(서윤, 하린, 지우, 민서 중 한 명)입니다.
형식: "이름: 메시지내용" (예: 하린: 헐 대박 진짜?)
여자 출연자끼리의 찐친 응원, 공감, 고민상담 조언 1문장을 작성하세요.`;
  } else if (target === '남자 단체방') {
    systemPrompt = `당신은 '우리들의 환승연애' 남자 출연자 중 한 명(박보검, 차은우, 서강준, 최우식 중 한 명)입니다.
형식: "이름: 메시지내용" (예: 차은우: 다들 솔직하게 직진합시다.)
남자 출연자들 간의 훈훈한 수다나 속마음 1문장을 작성하세요.`;
  }

  const payload = {
    contents: [{ parts: [{ text: userMsg }] }],
    systemInstruction: { parts: [{ text: systemPrompt }] }
  };

  try {
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text;
    return replyText ? replyText.trim() : null;
  } catch(e) {
    console.error("AI Fetch Error:", e);
    return null;
  }
}

let cast=[], started=false, day=1, roomCode="LOVE1";

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function log(t){
  let d=document.createElement('div');
  d.className='event';
  d.style.cssText='padding:8px;border-bottom:1px solid #2e2e3e;font-size:0.85rem';
  d.innerHTML='<strong style="color:var(--primary)">DAY '+day+'</strong> - '+t;
  $('timeline').prepend(d);
}

function renderCast(){
  $('castList').innerHTML='';
  cast.forEach(p=>{
    let el=document.createElement('div');
    el.className='person';
    el.innerHTML='<div class="avatar">'+p.name.slice(0,1)+'</div><b></b><br><small style="color:var(--muted)"></small>';
    el.querySelector('b').textContent=p.name;
    el.querySelector('small').textContent=p.role;
    $('castList').append(el);
  });
  $('finalChoice').innerHTML='<option>아직 선택하지 않음</option>'+cast.map(p=>'<option></option>').join('');
  [...$('finalChoice').options].forEach((o,i)=>{if(i)o.textContent=cast[i-1].name;});
}

function addMessage(who,txt,me=false){
  let b=document.createElement('div');
  b.className='bubble'+(me?' me':'');
  let n=document.createElement('div');
  n.className='who';
  n.textContent=who;
  let t=document.createElement('div');
  t.textContent=txt;
  b.append(n,t);
  $('messages').append(b);
  $('messages').scrollTop=$('messages').scrollHeight;
}

function initRealtime() {
  if(!supabaseClient) return;
  try {
    supabaseClient
      .channel('public:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        const msg = payload.new;
        if (msg.room_code === roomCode && msg.sender_name !== ($('playerName').value.trim()||'나')) {
          addMessage(msg.sender_name, msg.content, false);
        }
      })
      .subscribe();
  } catch(e) {
    console.log("Realtime sub error", e);
  }
}

$('start').onclick=()=>{

  let name = $('playerName').value.trim() || '나';
  
  cast = [{name, role: ($('job').value || '연구직') + ' · 참가자'}];
  while(cast.length < 4){
    let f = pick(femaleNames.filter(x => !cast.some(p => p.name === x)));
    cast.push({name: f, role: '여자 출연자'});
  }
  started = true;
  renderCast();
  log('방 [' + roomCode + '] 입주 완료! 자유롭게 대화를 진행하세요.');
  addMessage('SYSTEM', '방 코드 [' + roomCode + '] 입장 완료! 메신저 탭에서 대화를 시작해 보세요.');

};

$('addMegi').onclick=()=>{
  if(!started) return showNotice('⚠️ 먼저 [하우스 입주 / 방 생성하기] 버튼을 눌러주세요!');
  let p=pick(femaleNames.filter(x=>!cast.some(y=>y.name===x)));
  cast.push({name:p,role:'메기녀'});
  renderCast();
  log('🚨 메기녀 '+p+' 님이 등장했습니다.');
};

$('send').onclick=async ()=>{
  let v=$('messageInput').value.trim();
  if(!v)return;
  let myName = $('playerName').value.trim()||'나';
  let myJob = $('job').value.trim()||'참가자';
  addMessage(myName, v, true);
  $('messageInput').value='';

  if(supabaseClient) {
    try {
      await supabaseClient.from('messages').insert([
        { room_code: roomCode, sender_name: myName, content: v, channel: $('chatTarget').value }
      ]);
    } catch(e){
      console.log("Send msg error", e);
    }
  }

  let target=$('chatTarget').value;
  
  // AI로 실시간 맞춤 답장 생성
  const aiReply = await fetchAIResponse(target, v, { name: myName, job: myJob });

  if(aiReply) {
    if(target.includes('단체방')) {
      if(aiReply.includes(':')) {
        let parts = aiReply.split(':');
        addMessage(parts[0].trim(), parts.slice(1).join(':').trim());
      } else {
        addMessage(target === '여자 단체방' ? '하린' : (target === '남자 단체방' ? '차은우' : '박보검'), aiReply);
      }
    } else {
      addMessage(target, aiReply);
    }
  } else {
    // 백업 기본 로직
    setTimeout(()=>{
      if(target === '하우스 단체방') {
        let item = pick(groupChatLines);
        addMessage(item.who, item.txt);
      } else if (target === '여자 단체방') {
        let item = pick(femaleGroupChatLines);
        addMessage(item.who, item.txt);
      } else if (target === '남자 단체방') {
        let item = pick(maleGroupChatLines);
        addMessage(item.who, item.txt);
      } else if (characterPersonalities[target]) {
        addMessage(target, pick(characterPersonalities[target].reactions));
      }
    }, 900);
  }
};

$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});
$('newMission').onclick=()=>{day++;log('새로운 미션이도착했습니다.')};
$('secretText').onclick=()=>{addMessage('ANONYMOUS','오늘 당신을 가장 많이 생각한 사람이 있습니다.');log('익명 호감 문자가 도착했습니다.')};
$('choose').onclick=()=>{
  let v=$('finalChoice').value;
  if(v==='아직 선택하지 않음') return showNotice('⚠️ 최종 선택 상대를 목록에서 골라주세요!');
  $('finalResult').classList.remove('hidden');
  $('finalResult').textContent='당신의 최종 선택: '+v;
};
</script>
